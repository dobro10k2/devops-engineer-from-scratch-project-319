name: Deploy to Yandex Cloud K8s

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubernetes Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Install External Secrets Operator
        run: make k8s-install-eso

      - name: Create Yandex Cloud Auth Secret for ESO
        run: |
          echo '${{ secrets.ESO_SA_KEY_JSON }}' > authorized-key.json
          kubectl create secret generic yc-auth \
            --from-file=authorized-key=authorized-key.json \
            --namespace bulletin-board \
            --dry-run=client -o yaml | kubectl apply -f -
          rm authorized-key.json

      - name: Deploy Application with Helm
        run: |
          helm upgrade --install bulletin-board ./k8s/bulletin-board \
            --namespace bulletin-board \
            --set ingress.host="${{ vars.APP_DOMAIN }}" \
            --set lockboxSecretId="${{ secrets.LOCKBOX_SECRET_ID }}" \
            --wait

      - name: Deploy Observability (Prometheus & Fluent Bit)
        env:
          WORKSPACE_ID: ${{ vars.WORKSPACE_ID }}
          LOG_GROUP_ID: ${{ vars.LOG_GROUP_ID }}
        run: |
          make k8s-deploy-monitoring
          sleep 10
          make k8s-install-logging
