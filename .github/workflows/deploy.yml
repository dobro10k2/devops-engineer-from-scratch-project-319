name: Deploy to Yandex Cloud K8s

on:
  push:
    branches:
      - main # Пайплайн запустится только при пуше в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest # Выделяем бесплатный сервер от GitHub

    steps:
      # 1. Скачиваем твой код из репозитория на сервер GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Устанавливаем kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      # 3. Распаковываем kubeconfig из секретов, чтобы kubectl понял, куда подключаться
      - name: Configure Kubernetes Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      # 4. Деплой! Подменяем переменные и отправляем манифесты в кластер
      - name: Apply K8s Manifests
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          # Сначала разворачиваем БД и конфиги (как в твоем Makefile)
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/postgres/
          
          # Подменяем переменную ${APP_DOMAIN} в ingress.yaml и сразу применяем его
          envsubst < k8s/app/ingress.yaml | kubectl apply -f -
          
          # Применяем остальные файлы приложения (Deployment, Service, HPA, PDB)
          kubectl apply -f k8s/app/deployment.yaml
          kubectl apply -f k8s/app/service.yaml
          kubectl apply -f k8s/app/hpa.yaml
          kubectl apply -f k8s/app/pdb.yaml

      # 5. Ждем, пока новые поды успешно поднимутся (проверка Zero-Downtime)
      - name: Verify Deployment
        run: |
          kubectl -n bulletin-board rollout status deployment/bulletin-app
