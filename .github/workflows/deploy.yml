name: Deploy to Yandex Cloud K8s

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubernetes Access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Install External Secrets Operator
        run: make k8s-install-eso

      - name: Create Yandex Cloud Auth Secret for ESO
        run: |
          echo '${{ secrets.ESO_SA_KEY_JSON }}' > authorized-key.json
          kubectl create secret generic yc-auth \
            --from-file=authorized-key=authorized-key.json \
            --namespace bulletin-board \
            --dry-run=client -o yaml | kubectl apply -f -
          rm authorized-key.json

      - name: Wait for ESO CRDs to be established
        run: |
          kubectl wait --for=condition=established --timeout=60s crd/externalsecrets.external-secrets.io
          kubectl wait --for=condition=established --timeout=60s crd/secretstores.external-secrets.io

      - name: Deploy External Secrets Resources
        env:
          LOCKBOX_SECRET_ID: ${{ secrets.LOCKBOX_SECRET_ID }}
        run: |
          # Флаг успешного выполнения
          SUCCESS=false
          
          echo "Пытаемся применить ресурсы ESO..."
          # Делаем до 10 попыток с интервалом в 10 секунд
          for i in {1..10}; do
            # Принудительно сбрасываем кэш kubectl перед каждой попыткой
            rm -rf ~/.kube/cache
            
            if envsubst < k8s/external-secrets/eso-resources.yaml | kubectl apply -f -; then
              echo "✅ Ресурсы ESO успешно применены!"
              SUCCESS=true
              break
            fi
            
            echo "K3s еще не обновил схему API. Ждем 10 секунд (Попытка $i)..."
            sleep 10
          done
          
          # Если за 10 попыток не получилось — роняем пайплайн
          if [ "$SUCCESS" = false ]; then
            echo "❌ Ошибка: Не удалось применить ресурсы ESO."
            exit 1
          fi
          
          echo "Даем оператору 10 секунд на создание K8s Secrets из Lockbox..."
          sleep 10

      - name: Deploy Application with Helm
        run: |
          # Helm деплоит только нативные ресурсы (Deployment, Service и т.д.), поэтому никаких ошибок больше не будет!
          helm upgrade --install bulletin-board ./k8s/bulletin-board \
            --namespace bulletin-board \
            --set ingress.host="${{ vars.APP_DOMAIN }}" \
            --wait

      - name: Deploy Observability (Prometheus & Fluent Bit)
        env:
          WORKSPACE_ID: ${{ vars.WORKSPACE_ID }}
          LOG_GROUP_ID: ${{ vars.LOG_GROUP_ID }}
        run: |
          make k8s-deploy-monitoring
          make k8s-install-logging
