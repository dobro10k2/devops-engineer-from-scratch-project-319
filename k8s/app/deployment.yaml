apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulletin-app
  namespace: bulletin-board
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bulletin-app
  template:
    metadata:
      labels:
        app: bulletin-app
    spec:
      containers:
      - name: bulletin-app
        image: ghcr.io/dobro10k2/project-devops-deploy:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics

        envFrom:
        - configMapRef:
            name: app-config
        
        env:
        # PostgreSQL пароль
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
        
        # Для совместимости
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
        
        - name: APP_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: APP_SECRET
        
        # S3 / AWS
        - name: STORAGE_S3_ACCESSKEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: AWS_ACCESS_KEY_ID
              
        - name: STORAGE_S3_SECRETKEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: AWS_SECRET_ACCESS_KEY

        resources:
          limits:
            cpu: "400m"
            memory: "300Mi"
          requests:
            cpu: "200m"
            memory: "150Mi"
