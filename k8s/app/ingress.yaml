apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bulletin-app-ingress
  namespace: bulletin-board
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: ${APP_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bulletin-app
            port:
              number: 8080
