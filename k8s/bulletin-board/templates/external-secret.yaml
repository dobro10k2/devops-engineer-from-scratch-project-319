apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secret-es
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: yandex-lockbox
    kind: SecretStore
  target:
    name: app-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: "{{ .Values.lockboxSecretId }}"
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: "{{ .Values.lockboxSecretId }}"
        property: DB_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: "{{ .Values.lockboxSecretId }}"
        property: S3_ACCESS_KEY
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: "{{ .Values.lockboxSecretId }}"
        property: S3_SECRET_KEY
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: "{{ .Values.lockboxSecretId }}"
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: "{{ .Values.lockboxSecretId }}"
        property: S3_SECRET_KEY
    - secretKey: APP_SECRET
      remoteRef:
        key: "{{ .Values.lockboxSecretId }}"
        property: APP_SECRET
