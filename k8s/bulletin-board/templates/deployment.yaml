apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulletin-app
spec:
  replicas: {{ .Values.app.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bulletin-app
  template:
    metadata:
      labels:
        app: bulletin-app
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - bulletin-app
              topologyKey: kubernetes.io/hostname
      containers:
      - name: bulletin-app
        image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
        imagePullPolicy: {{ .Values.app.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
        - name: APP_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: APP_SECRET
        - name: STORAGE_S3_ACCESSKEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: AWS_ACCESS_KEY_ID
        - name: STORAGE_S3_SECRETKEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: AWS_SECRET_ACCESS_KEY
        resources:
{{ toYaml .Values.app.resources | indent 10 }}
