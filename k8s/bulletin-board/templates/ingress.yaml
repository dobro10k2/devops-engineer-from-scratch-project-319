apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bulletin-app-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bulletin-app
            port:
              number: 8080
